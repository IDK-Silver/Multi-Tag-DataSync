services:

  phpapache:
    container_name: multi-tag-datasync-apache
    build: ./docker/php_apache/
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - mysql_db
    volumes:
      - .:/var/www/html/
    environment:
      Runtime: docker

  mysql_db:
    container_name: multi-tag-datasync-db
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: www_nutn_ds
      MYSQL_USER: idk
      MYSQL_PASSWORD: KanoBest
    ports:
      - 3306:3306

  phpmyadmin:
    container_name: multi-tag-datasync-admin
    image: phpmyadmin/phpmyadmin
    ports:
      - 8080:80
    links:
      - mysql_db
    environment:
      PMA_HOST: mysql_db






  
      
